<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>StageCore SPK-01</title>
  <style>body{font:15px system-ui;margin:2rem;max-width:960px}button,input{font:inherit;padding:.55rem;margin:.2rem}pre{background:#f5f5f5;padding:1rem;overflow:auto}.row{display:flex;gap:.5rem;flex-wrap:wrap}</style>
</head>
<body>
  <h1>StageCore — Core Stack Spike</h1>
  <p>Executable path: Project → Cue → Publish → GO → simulated Action → realtime Event → persistent history.</p>
  <div class="row"><button id="create">Create Demo Project</button><button id="cue">Add Cue</button><button id="publish">Publish</button><button id="go">GO</button><button id="refresh">Refresh State</button></div>
  <h2>State</h2><pre id="state">loading…</pre>
  <h2>Realtime Events</h2><pre id="events"></pre>
<script>
let projectID=null;
async function request(path,body){const r=await fetch(path,{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)});const j=await r.json();if(!r.ok)throw new Error(j.error||r.statusText);return j;}
async function refresh(){const st=await(await fetch('/api/state')).json();projectID=st.active_project_id||projectID;document.querySelector('#state').textContent=JSON.stringify(st,null,2);}
document.querySelector('#create').onclick=async()=>{const p=await request('/api/projects',{name:'Demo Show'});projectID=p.id;await refresh();};
document.querySelector('#cue').onclick=async()=>{if(!projectID)return alert('Create project first');await request('/api/cues',{project_id:projectID,number:'1',name:'Intro',message:'simulated OSC placeholder'});await refresh();};
document.querySelector('#publish').onclick=async()=>{if(!projectID)return alert('Create project first');await request('/api/publish',{project_id:projectID});await refresh();};
document.querySelector('#go').onclick=async()=>{if(!projectID)return alert('Create project first');await request('/api/go',{project_id:projectID});await refresh();};
document.querySelector('#refresh').onclick=refresh;
const stream=new EventSource('/api/events');stream.onmessage=(e)=>{const box=document.querySelector('#events');box.textContent=e.data+'\n'+box.textContent;};refresh();
</script>
</body>
</html>
