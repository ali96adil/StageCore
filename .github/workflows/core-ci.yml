name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Qualification runner self-tests
        if: matrix.go == '1.26.x'
        run: |
          tools/qualification/test-runner.sh
          tools/qualification/test-device-probe.sh
          tools/qualification/test-manifest.sh
          tools/qualification/test-campaign-state.sh
          tools/qualification/test-milestone.sh
          tools/qualification/test-safe-command.sh
          tools/qualification/test-command-evidence.sh
          tools/qualification/test-physical-confirmations.sh
          tools/qualification/test-fade-timing.sh
          tools/qualification/test-supersession.sh
          tools/qualification/test-envelope-gates.sh
          tools/qualification/test-power-event.sh
          tools/qualification/test-wifi-loss.sh
          tools/qualification/test-hub-restart-evidence.sh
          tools/qualification/test-dmx-stability.sh
          tools/qualification/test-emergency-blackout.sh
          tools/qualification/test-lighting-config-truth.sh
          tools/qualification/test-electrical-path.sh
          tools/qualification/test-dmx-full-chain.sh
          tools/qualification/test-tablet-evidence.sh
          tools/qualification/test-tablet-workflow.sh
          tools/qualification/test-tablet-group.sh
          tools/qualification/test-draft-recovery.sh
          tools/qualification/test-batch-workflows.sh
          tools/qualification/test-phase4-inventory.sh
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: matrix.go == '1.26.x'
        run: go test -race ./...
      - name: Linux ARM64 CGo-free product builds
        if: matrix.go == '1.26.x'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o /tmp/stagecore-arm64 ./cmd/stagecore
          go build -o /tmp/stagecore-hub-arm64 ./cmd/stagecore-hub
          go build -o /tmp/stagecore-ha-witness-arm64 ./cmd/stagecore-ha-witness
          go build -o /tmp/stagecore-osc-plugin-arm64 ./cmd/stagecore-osc-plugin
          go build -o /tmp/stagecore-pairing-arm64 ./cmd/stagecore-pairing
          go build -o /tmp/stagecore-setup-arm64 ./cmd/stagecore-setup
