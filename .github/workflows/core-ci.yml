name: Core CI

on:
  pull_request:
  push:
    branches: [main]

# Keep the full matrix, race tests and ARM64 builds, but cancel superseded
# runs when an in-progress PR receives a newer commit. Engineering batches
# should be staged on a branch *before* creating a PR.
concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check Operator JS syntax
        if: matrix.go == '1.26.x'
        run: node --check internal/operatorweb/static/phase4.js
      - name: Receiver OSC acknowledgment lab interoperability
        if: matrix.go == '1.26.x'
        run: |
          node --check tools/receiver-ack-lab/receiver_ack.js
          node tools/receiver-ack-lab/receiver_ack.js --self-test
          node --check tools/receiver-ack-lab/app_observer.js
          node --check tools/receiver-ack-lab/max_receiver_bridge.js
          node --test tools/receiver-ack-lab/app_observer.test.js tools/receiver-ack-lab/max_receiver_bridge.test.js tools/receiver-ack-lab/patch_structure.test.js
          node --check tools/receiver-ack-lab/vdmx_oscquery_readback.js
          node --test tools/receiver-ack-lab/vdmx_oscquery_readback.test.js
          node --check tools/receiver-ack-lab/vdmx_readback_session.js
          node --test tools/receiver-ack-lab/vdmx_readback_session.test.js
          node --check tools/receiver-ack-lab/vdmx_readback_fixture_cli.js
          node --test tools/receiver-ack-lab/vdmx_readback_fixture_cli.test.js
          node --check tools/receiver-ack-lab/vdmx_loopback_read.js
          node --test tools/receiver-ack-lab/vdmx_loopback_read.test.js
          node --check tools/receiver-ack-lab/vdmx_manual_compare.js
          node --test tools/receiver-ack-lab/vdmx_manual_compare.test.js
          node --check tools/receiver-ack-lab/vdmx_oscquery_path.js
          node --test tools/receiver-ack-lab/vdmx_spaced_path.test.js
      - name: Firmware Foundation contract
        if: matrix.go == '1.26.x'
        run: python3 -m unittest tests/firmware_foundation_contract_test.py -v
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: matrix.go == '1.26.x'
        # SQLite-heavy httpapi fixtures can exceed Go's default 10-minute
        # package timeout when dozens of race-instrumented packages run
        # concurrently on a loaded hosted runner. Bound package concurrency
        # and give the SAME race assertions a measured 15-minute budget.
        # Do not skip packages, use -short, or suppress race failures.
        run: go test -race -p 4 -timeout 15m ./...
      - name: Linux ARM64 CGo-free product builds
        if: matrix.go == '1.26.x'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o /tmp/stagecore-arm64 ./cmd/stagecore
          go build -o /tmp/stagecore-hub-arm64 ./cmd/stagecore-hub
          go build -o /tmp/stagecore-camera-relay-arm64 ./cmd/stagecore-camera-relay
          go build -o /tmp/stagecore-ha-witness-arm64 ./cmd/stagecore-ha-witness
          go build -o /tmp/stagecore-osc-plugin-arm64 ./cmd/stagecore-osc-plugin
          go build -o /tmp/stagecore-pairing-arm64 ./cmd/stagecore-pairing
          go build -o /tmp/stagecore-setup-arm64 ./cmd/stagecore-setup
