name: Core CI

on:
  pull_request:
  push:
    branches: [main]

# Keep the full matrix, race tests and ARM64 builds, but cancel superseded
# runs when an in-progress PR receives a newer commit. Engineering batches
# should be staged on a branch *before* creating a PR.
concurrency:
  group: core-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Check all Operator JS syntax
        if: matrix.go == '1.26.x'
        run: |
          set -euo pipefail
          find internal/operatorweb/static -maxdepth 1 -name '*.js' -print0 | xargs -0 -n 1 node --check
      - name: Operator GO recovery regressions
        if: matrix.go == '1.26.x'
        run: node --test tests/runtime-operator-*.test.cjs
      - name: Firmware Foundation contract
        if: matrix.go == '1.26.x'
        run: python3 -m unittest tests/firmware_foundation_contract_test.py -v
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: matrix.go == '1.26.x'
        run: go test -race ./...
      - name: Linux ARM64 CGo-free product builds
        if: matrix.go == '1.26.x'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o /tmp/stagecore-arm64 ./cmd/stagecore
          go build -o /tmp/stagecore-hub-arm64 ./cmd/stagecore-hub
          go build -o /tmp/stagecore-camera-relay-arm64 ./cmd/stagecore-camera-relay
          go build -o /tmp/stagecore-ha-witness-arm64 ./cmd/stagecore-ha-witness
          go build -o /tmp/stagecore-osc-plugin-arm64 ./cmd/stagecore-osc-plugin
          go build -o /tmp/stagecore-pairing-arm64 ./cmd/stagecore-pairing
          go build -o /tmp/stagecore-setup-arm64 ./cmd/stagecore-setup

  # Build a downloadable ARM64 F-010 bundle on CI so the Raspberry Pi does
  # NOT require a Go compiler. Artifact remains an uninstalled release candidate.
  show-candidate-arm64-bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true
      - name: Verify exact PR source
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git status --porcelain --untracked-files=all)"
          git rev-parse HEAD
      - name: Build full offline media and Pi ARM64 bundle
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/build-release.sh "$RUNNER_TEMP/stagecore-release"
          BUNDLE="$RUNNER_TEMP/stagecore-release/stagecore-linux-arm64"
          test "$(cat "$BUNDLE/RELEASE_REVISION")" = "$(git rev-parse HEAD)"
          (cd "$BUNDLE" && sha256sum -c SHA256SUMS)
      - name: Upload Pi ARM64 StageCore F-010 bundle
        uses: actions/upload-artifact@v4
        with:
          name: stagecore-show-candidate-linux-arm64
          path: ${{ runner.temp }}/stagecore-release/stagecore-linux-arm64.tar.gz
          retention-days: 7
          if-no-files-found: error
