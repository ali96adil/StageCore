name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Verify module lock
        run: |
          go mod tidy
          git diff --exit-code -- go.mod go.sum
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: matrix.go == '1.26.x'
        run: go test -race ./...
      - name: Linux ARM64 CGo-free product builds
        if: matrix.go == '1.26.x'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: |
          go build -o /tmp/stagecore-arm64 ./cmd/stagecore
          go build -o /tmp/stagecore-hub-arm64 ./cmd/stagecore-hub
          go build -o /tmp/stagecore-osc-plugin-arm64 ./cmd/stagecore-osc-plugin
          go build -o /tmp/stagecore-pairing-arm64 ./cmd/stagecore-pairing
          go build -o /tmp/stagecore-setup-arm64 ./cmd/stagecore-setup
