name: M0 CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: Go ${{ matrix.go }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        go: ['1.26.x', '1.27.x']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go }}
          cache: true
      - name: Resolve module graph
        run: go mod tidy
      - name: Test
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Race tests
        if: matrix.go == '1.26.x'
        run: go test -race ./...
      - name: Linux ARM64 CGo-free build
        if: matrix.go == '1.26.x'
        env:
          CGO_ENABLED: '0'
          GOOS: linux
          GOARCH: arm64
        run: go build -o /tmp/stagecore-hub-arm64 ./cmd/stagecore-hub
      - name: Dependency lock evidence
        if: matrix.go == '1.26.x'
        run: |
          echo '---BEGIN-GO-MOD---'
          cat go.mod
          echo '---END-GO-MOD---'
          echo '---BEGIN-GO-SUM---'
          cat go.sum
          echo '---END-GO-SUM---'
